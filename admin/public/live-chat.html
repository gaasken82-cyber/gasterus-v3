<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Live Chat Desk — SBOTOTO Admin</title>
<style>
:root { --gold:#f7a600; --dark:#111827; --panel:#fff; --line:#e5e7eb; }
* { box-sizing: border-box; }
body { margin:0; font-family: Manrope, system-ui, sans-serif; background:#f3f4f6; color:var(--dark); }
header { background: linear-gradient(120deg,#7f1d1d,#b45309); color:#fff; padding:14px 22px; display:flex; justify-content:space-between; align-items:center; }
header h1 { margin:0; font-size:18px; letter-spacing:.4px; }
#conn { font-size:12px; opacity:.9; }
.layout { display:grid; grid-template-columns: 300px 1fr; height: calc(100vh - 58px); }
aside { background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; }
.session { padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
.session:hover { background:#fffbeb; }
.session.active { background:#fef3c7; border-left:4px solid var(--gold); }
.session .nm { font-weight:800; font-size:14px; }
.session .meta { font-size:11.5px; color:#6b7280; margin-top:2px; display:flex; gap:8px; align-items:center; }
.pill { padding:1px 8px; border-radius:9px; font-size:10.5px; font-weight:700; }
.pill.waiting { background:#fee2e2; color:#b91c1c; }
.pill.active { background:#dcfce7; color:#15803d; }
.pill.closed { background:#e5e7eb; color:#6b7280; }
.unread-badge { background:#dc2626; color:#fff; border-radius:9px; font-size:10.5px; padding:0 7px; font-weight:800; }
main { display:flex; flex-direction:column; }
#empty { margin:auto; color:#9ca3af; font-size:15px; }
.chat-head { display:none; align-items:center; justify-content:space-between; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line); }
.chat-head .nm { font-weight:800; }
.chat-head .btns { display:flex; gap:8px; }
.btn { border:1px solid var(--line); background:#fff; border-radius:9px; padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer; }
.btn.danger { color:#b91c1c; border-color:#fecaca; }
.btn:hover { background:#f9fafb; }
#msgs { flex:1; overflow-y:auto; padding:18px 20px; background:#faf7f2; display:none; flex-direction:column; gap:8px; }
.bub { max-width:70%; padding:9px 13px; border-radius:14px; font-size:13.5px; line-height:1.45; }
.bub.agent { align-self:flex-end; background:linear-gradient(135deg,#f7a600,#dc8b00); color:#fff; border-bottom-right-radius:4px; }
.bub.member { align-self:flex-start; background:#fff; border:1px solid var(--line); border-bottom-left-radius:4px; }
.bub .who { font-size:10px; font-weight:800; opacity:.65; text-transform:uppercase; letter-spacing:.5px; margin-bottom:2px; }
.canned { display:none; gap:6px; padding:8px 20px; background:#fff; border-top:1px solid var(--line); flex-wrap:wrap; }
.canned button { border:1px dashed var(--gold); background:#fffbeb; border-radius:8px; padding:5px 10px; font-size:11.5px; cursor:pointer; }
.composer { display:none; gap:8px; padding:12px 20px; background:#fff; border-top:1px solid var(--line); }
.composer input { flex:1; border:1px solid var(--line); border-radius:10px; padding:11px 14px; font-size:13.5px; }
.composer button { border:none; border-radius:10px; padding:0 22px; color:#fff; font-weight:800; cursor:pointer; background:linear-gradient(135deg,#f7a600,#dc2626); }
</style>
<link href="enterprise-3d-r7000.css?v=7000-3d-glass" rel="stylesheet"/>
</head>
<body>
<header>
  <h1>🎧 Live Chat Desk</h1>
  <div id="conn">Menghubungkan…</div>
</header>
<div class="layout">
  <aside id="list"></aside>
  <main>
    <div id="empty">Pilih sesi chat di kiri untuk mulai merespons.</div>
    <div class="chat-head" id="chat-head">
      <div><div class="nm" id="chat-name"></div><div class="meta" id="chat-meta" style="font-size:12px;color:#6b7280"></div></div>
      <div class="btns">
        <select id="transfer-sel" class="btn" title="Transfer ke agen"><option value="">Transfer ke…</option><option value="CS-1">CS-1</option><option value="CS-2">CS-2</option><option value="Supervisor">Supervisor</option></select>
        <button class="btn danger" id="btn-close">Akhiri Sesi</button>
      </div>
    </div>
    <div id="msgs"></div>
    <div class="canned" id="canned"></div>
    <div class="composer" id="composer">
      <input id="reply" placeholder="Tulis balasan… (Enter kirim)" maxlength="2000"/>
      <button id="btn-send">Kirim</button>
    </div>
  </main>
</div>
<script>
(function () {
  'use strict';
  var API = window.LIVECHAT_API || 'http://localhost:8090';
  var KEY = sessionStorage.getItem('lcw_agent_key') || (window.LIVECHAT_AGENT_KEY || 'dev-agent-key');
  var AGENT = sessionStorage.getItem('lcw_agent_name') || ('CS-' + Math.floor(100 + Math.random() * 900));
  sessionStorage.setItem('lcw_agent_key', KEY); sessionStorage.setItem('lcw_agent_name', AGENT);

  var sessions = {}; var active = null; var es = null; var retry = 0;
  var $ = function (id) { return document.getElementById(id); };
  var CANNED = [
    'Selamat datang di SBOTOTO! Ada yang bisa kami bantu?',
    'Mohon tunggu sebentar, kami cek transaksinya ya, Kak.',
    'Deposit sudah kami terima dan sedang diproses. 🙏',
    'Withdraw sedang diproses, rata-rata 3 menit selesai.',
    'Silakan cek kembali data rekening Anda, Kak.'
  ];

  function renderCanned() {
    var c = $('canned'); c.innerHTML = '';
    CANNED.forEach(function (t) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = t;
      b.onclick = function () { $('reply').value = t; $('reply').focus(); };
      c.appendChild(b);
    });
  }
  function bub(m) {
    var d = document.createElement('div');
    d.className = 'bub ' + (m.from === 'agent' ? 'agent' : 'member');
    var w = document.createElement('div'); w.className = 'who'; w.textContent = m.from === 'agent' ? (m.fromName || AGENT) : (m.fromName || 'Member');
    var b = document.createElement('div'); b.textContent = m.body; // XSS-safe
    d.appendChild(w); d.appendChild(b); return d;
  }
  function renderList() {
    var L = $('list'); L.innerHTML = '';
    Object.values(sessions).sort(function (a, b) { return (b.lastAt || 0) - (a.lastAt || 0); }).forEach(function (s) {
      var d = document.createElement('div');
      d.className = 'session' + (active === s.sessionId ? ' active' : '');
      var nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = s.displayName || s.sessionId.slice(0, 8);
      var meta = document.createElement('div'); meta.className = 'meta';
      var pill = document.createElement('span'); pill.className = 'pill ' + (s.status || 'waiting'); pill.textContent = s.status || 'waiting';
      meta.appendChild(pill);
      if (s.unread) { var u = document.createElement('span'); u.className = 'unread-badge'; u.textContent = String(s.unread); meta.appendChild(u); }
      if (s.typingMember) { var t = document.createElement('span'); t.textContent = '✍ menulis…'; meta.appendChild(t); }
      d.appendChild(nm); d.appendChild(meta);
      d.onclick = function () { openSession(s.sessionId); };
      L.appendChild(d);
    });
  }
  function openSession(id) {
    active = id;
    $('empty').style.display = 'none';
    ['chat-head', 'msgs', 'canned', 'composer'].forEach(function (i) { $(i).style.display = 'flex'; });
    var s = sessions[id];
    $('chat-name').textContent = s ? (s.displayName || id) : id;
    $('chat-meta').textContent = 'Sesi: ' + id.slice(0, 8) + '…';
    var M = $('msgs'); M.innerHTML = '';
    ((s && s.messages) || []).forEach(function (m) { M.appendChild(bub(m)); });
    M.scrollTop = M.scrollHeight;
    if (s) s.unread = 0;
    renderList();
  }
  function api(path, body) {
    return fetch(API + path, {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + KEY },
      body: JSON.stringify(body)
    }).catch(function () {});
  }
  function send() {
    var v = $('reply').value.trim(); if (!v || !active) return;
    api('/api/agent/message', { agentName: AGENT, sessionId: active, body: v });
    $('reply').value = '';
  }
  $('btn-send').onclick = send;
  $('reply').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  $('btn-close').onclick = function () { if (active) api('/api/agent/status', { sessionId: active, status: 'closed' }); };
  $('transfer-sel').onchange = function () {
    var t = this.value; if (t && active) api('/api/agent/transfer', { agentName: AGENT, sessionId: active, target: t });
    this.value = '';
  };
  // Beep notification (WebAudio, tanpa file audio)
  var actx = null;
  function beep() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; g.gain.value = 0.08;
      o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.12);
    } catch (e) {}
  }
  function connect() {
    $('conn').textContent = 'Menghubungkan…';
    es = new EventSource(API + '/api/agent/stream?name=' + encodeURIComponent(AGENT));
    es.onopen = function () { retry = 0; $('conn').textContent = 'Terhubung sebagai ' + AGENT; };
    es.onerror = function () {
      $('conn').textContent = 'Koneksi terputus — menyambung ulang…';
      es.close();
      retry = Math.min(retry + 1, 5);
      setTimeout(connect, 1000 * retry);
    };
    es.onmessage = function (ev) {
      var e; try { e = JSON.parse(ev.data); } catch (x) { return; }
      if (e.type === 'sessions') {
        (e.sessions || []).forEach(function (s) { sessions[s.sessionId] = Object.assign(sessions[s.sessionId] || {}, s); });
        renderList();
      } else if (e.type === 'message') {
        var s = sessions[e.sessionId] = sessions[e.sessionId] || { sessionId: e.sessionId, messages: [] };
        s.messages.push(e.message); s.lastAt = e.message.at || Date.now();
        if (e.message.from === 'member' && e.sessionId !== active) { s.unread = (s.unread || 0) + 1; beep(); }
        if (e.sessionId === active) { var M = $('msgs'); M.appendChild(bub(e.message)); M.scrollTop = M.scrollHeight; }
        renderList();
      } else if (e.type === 'member-typing') {
        if (sessions[e.sessionId]) sessions[e.sessionId].typingMember = true;
        renderList();
      }
    };
  }
  renderCanned();
  connect();
})();

</script>
<script src="enterprise-3d-r7000.js?v=7000-3d-glass"></script>
</body>
</html>
