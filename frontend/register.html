<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Daftar Akun Baru — GASTERUS</title>
  <meta name="description" content="Daftar akun resmi Gasterus gratis. Proses cepat 1 menit.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/mobile-blue.css">
</head>
<body class="page-register">
  <div class="site">

    <!-- Header -->
    <header class="brand-bar">
      <h1 class="brand-title">GASTERUS</h1>
      <a class="btn-livechat" href="https://wa.me/6285136342563" target="_blank" rel="noopener noreferrer">Live Chat</a>
    </header>

    <!-- Register Title -->
    <div class="reg-title">Register</div>
    <div class="reg-divider"></div>

    <!-- Register Form -->
    <form class="reg-form" id="register-form">

      <div class="reg-field">
        <label class="reg-label">Username <span>*</span></label>
        <input class="reg-input" type="text" id="reg-username" name="username" placeholder="Username" required autocomplete="username">
      </div>

      <div class="reg-field">
        <label class="reg-label">Password <span>*</span></label>
        <input class="reg-input" type="password" id="reg-password" name="password" placeholder="Password" required autocomplete="new-password">
      </div>

      <div class="reg-field">
        <label class="reg-label">Konfirmasi Password <span>*</span></label>
        <input class="reg-input" type="password" id="reg-password-confirm" name="passwordConfirm" placeholder="Konfirmasi Password" required autocomplete="new-password">
      </div>

      <div class="reg-field">
        <label class="reg-label">Email <span>*</span></label>
        <input class="reg-input" type="email" id="reg-email" name="email" placeholder="Alamat email anda" required autocomplete="email">
      </div>

      <div class="reg-field">
        <label class="reg-label">No. Telp/HP <span>*</span></label>
        <div class="reg-phone-wrap">
          <span class="reg-phone-prefix">+62</span>
          <input type="tel" id="reg-phone" name="phone" placeholder="Nomor telepon anda" autocomplete="tel">
        </div>
      </div>

      <div class="reg-field">
        <label class="reg-label">Referral</label>
        <span class="reg-referral-value">-</span>
        <input type="hidden" name="referralCode" id="reg-referral" value="">
      </div>

      <!-- Pengaturan Bank Section -->
      <div class="reg-section-title">Pengaturan Bank</div>
      <div class="reg-divider"></div>

      <div class="reg-field">
        <label class="reg-label">Nama Bank <span>*</span></label>
        <select class="reg-input" id="reg-bank-name" name="bankName" required>
          <option value="BCA">BCA</option>
          <option value="MANDIRI">MANDIRI</option>
          <option value="BNI">BNI</option>
          <option value="BRI">BRI</option>
          <option value="CIMB">CIMB NIAGA</option>
          <option value="PERMATA">BANK PERMATA</option>
          <option value="DANAMON">BANK DANAMON</option>
          <option value="DANA">DANA</option>
          <option value="OVO">OVO</option>
          <option value="GOPAY">GOPAY</option>
          <option value="LINKAJA">LINKAJA</option>
        </select>
      </div>

      <div class="reg-field">
        <label class="reg-label">Nama Rekening <span>*</span></label>
        <input class="reg-input" type="text" id="reg-account-name" name="accountName" placeholder="Nama rekening anda" required>
      </div>

      <div class="reg-field">
        <label class="reg-label">Nomor Rekening <span>*</span></label>
        <input class="reg-input" type="text" id="reg-account-number" name="accountNumber" placeholder="Nomor rekening" required>
      </div>

      <!-- Captcha -->
      <div class="reg-field">
        <label class="reg-label">Captcha <span>*</span></label>
        <div style="flex:1">
          <div class="reg-captcha-row">
            <div class="reg-captcha-img" id="captcha-container">
              <!-- Dynamic SVG -->
            </div>
            <button type="button" class="reg-captcha-refresh" id="btn-refresh-captcha">↻</button>
          </div>
          <input class="reg-input" type="text" id="reg-captcha-code" name="captchaCode" placeholder="Captcha" required maxlength="6" style="text-transform: uppercase;">
        </div>
      </div>

      <!-- Checkboxes -->
      <label class="reg-checkbox">
        <input type="checkbox" checked> Saya bersedia menerima email promosi gasterus.fun
      </label>
      <label class="reg-checkbox">
        <input type="checkbox" required> Saya setuju dengan <a href="rules.html">peraturan yang berlaku</a>
      </label>

      <!-- Submit Button (di dalam form agar form.querySelector('button[type="submit"]') tidak null) -->
      <button type="submit" class="btn-register-submit">Daftar</button>

    </form>

    <!-- Footer -->
    <footer>
      <div>&copy; Copyright 2014 - 2026 GASTERUS. All Rights Reserved.</div>
    </footer>

  </div>

  <script type="module" src="js/register.js"></script>
</body>
</html>
