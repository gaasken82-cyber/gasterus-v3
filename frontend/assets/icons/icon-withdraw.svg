<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Ambient Shadow for 3D Bounding Box -->
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020817" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.5" />
    </filter>

    <!-- Sapphire Edge Glow -->
    <filter id="sapphireGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Floating Object Shadow onto Glass Backplate -->
    <filter id="innerObjShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#020c22" flood-opacity="0.85" />
    </filter>

    <!-- Chrome / Silver Rim Metallic Filter -->
    <linearGradient id="silverBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#94a3b8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#f8fafc" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#64748b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.85" />
    </linearGradient>

    <!-- Sapphire Blue Glass Gradient -->
    <linearGradient id="sapphireFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#091e42" />
    </linearGradient>

    <!-- Glass Body Surface Fill -->
    <linearGradient id="glassBodyGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.7" />
    </linearGradient>

    <!-- Glass Top Sheen Specular Highlight -->
    <linearGradient id="specularHighlight" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Arrow Gradients -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- ================= 3D GLASS BOUNDING BOX ================= -->
  <g id="boundingBox3D" filter="url(#boxShadow)">
    <rect x="68" y="76" width="376" height="376" rx="72" fill="#040d21" stroke="#0f2b5c" stroke-width="4" />
    <rect x="68" y="68" width="376" height="376" rx="72" fill="url(#glassBodyGrad)" stroke="url(#sapphireFrameGrad)" stroke-width="6" />
    <rect x="75" y="75" width="362" height="362" rx="66" fill="none" stroke="url(#silverBezel)" stroke-width="2" opacity="0.85" />
    <path d="M78 140 C78 95, 95 78, 140 78 L372 78 C310 140, 210 260, 78 310 Z" fill="url(#specularHighlight)" opacity="0.6" />
    <path d="M120 436 C200 442, 312 442, 392 436 C350 422, 162 422, 120 436 Z" fill="#38bdf8" opacity="0.4" filter="url(#sapphireGlow)" />
  </g>

  <!-- ================= 3D WITHDRAW / CASHOUT ICON ================= -->
  <g id="iconSubject" filter="url(#innerObjShadow)">
    <!-- 3D Precision Vault Ring -->
    <circle cx="256" cy="256" r="104" fill="none" stroke="url(#silverBezel)" stroke-width="6" opacity="0.85" />
    <circle cx="256" cy="256" r="92" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="14 10" opacity="0.7" />

    <!-- 3D Arrow Shaft & Head (Extruded 3D Isometric) -->
    <!-- Extruded Shadow / Thickness -->
    <path d="M256 160 L326 230 L286 230 L286 330 L226 330 L226 230 L186 230 Z" transform="translate(0 10)" fill="#061638" stroke="#0f2b5c" stroke-width="3" />

    <!-- Front Arrow Face -->
    <path d="M256 160 L326 230 L286 230 L286 330 L226 330 L226 230 L186 230 Z" fill="url(#arrowGrad)" stroke="url(#silverBezel)" stroke-width="3" stroke-linejoin="round" />

    <!-- Facet Chisel Line (Center Ridge) -->
    <path d="M256 164 L256 328" stroke="#ffffff" stroke-width="2.5" opacity="0.8" />
    <path d="M256 164 L322 230" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
    <path d="M256 164 L190 230" stroke="#60a5fa" stroke-width="1.5" opacity="0.6" />

    <!-- Floating Currency Beams / Speed Trails -->
    <line x1="170" y1="280" x2="170" y2="340" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="342" y1="280" x2="342" y2="340" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.75" />
  </g>

  <!-- Front Glass Specular Rim Corner Glint -->
  <circle cx="112" cy="112" r="6" fill="#ffffff" opacity="0.95" />
  <ellipse cx="112" cy="112" rx="14" ry="2" fill="#ffffff" opacity="0.8" />
  <ellipse cx="112" cy="112" rx="2" ry="14" fill="#ffffff" opacity="0.8" />
</svg>
