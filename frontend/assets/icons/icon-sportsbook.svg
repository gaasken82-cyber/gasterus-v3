<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Ambient Shadow for 3D Bounding Box -->
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020817" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.5" />
    </filter>

    <!-- Sapphire Edge Glow -->
    <filter id="sapphireGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Floating Object Shadow onto Glass Backplate -->
    <filter id="innerObjShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#020c22" flood-opacity="0.85" />
    </filter>

    <!-- Chrome / Silver Rim Metallic Filter -->
    <linearGradient id="silverBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#94a3b8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#f8fafc" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#64748b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.85" />
    </linearGradient>

    <!-- Sapphire Blue Glass Gradient -->
    <linearGradient id="sapphireFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#091e42" />
    </linearGradient>

    <!-- Glass Body Surface Fill -->
    <linearGradient id="glassBodyGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.7" />
    </linearGradient>

    <!-- Glass Top Sheen Specular Highlight -->
    <linearGradient id="specularHighlight" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Football Ceramic Facet Gradient -->
    <radialGradient id="ballBaseGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e2e8f0" />
      <stop offset="80%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </radialGradient>

    <!-- Ball Sapphire Inlay Facets -->
    <linearGradient id="ballSapphireFacet" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f2b5c" />
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="orbitRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- ================= 3D GLASS BOUNDING BOX ================= -->
  <g id="boundingBox3D" filter="url(#boxShadow)">
    <!-- 3D Back/Depth Extrusion (Bottom Offset) -->
    <rect x="68" y="76" width="376" height="376" rx="72" fill="#040d21" stroke="#0f2b5c" stroke-width="4" />

    <!-- Outer Sapphire Beveled Frame -->
    <rect x="68" y="68" width="376" height="376" rx="72" fill="url(#glassBodyGrad)" stroke="url(#sapphireFrameGrad)" stroke-width="6" />

    <!-- Inner Metallic Silver Precision Border -->
    <rect x="75" y="75" width="362" height="362" rx="66" fill="none" stroke="url(#silverBezel)" stroke-width="2" opacity="0.85" />

    <!-- Subtle Internal Glass Reflection Wedge -->
    <path d="M78 140 C78 95, 95 78, 140 78 L372 78 C310 140, 210 260, 78 310 Z" fill="url(#specularHighlight)" opacity="0.6" />

    <!-- Bottom Internal Sapphire Bounce Glow -->
    <path d="M120 436 C200 442, 312 442, 392 436 C350 422, 162 422, 120 436 Z" fill="#38bdf8" opacity="0.4" filter="url(#sapphireGlow)" />
  </g>

  <!-- ================= 3D SPORTSBOOK FOOTBALL ICON ================= -->
  <g id="iconSubject" filter="url(#innerObjShadow)">
    <!-- Orbital Energy Ring -->
    <ellipse cx="256" cy="262" rx="138" ry="46" transform="rotate(-24 256 262)" fill="none" stroke="url(#orbitRing)" stroke-width="5" stroke-dasharray="160 30 90 20" opacity="0.85" />

    <!-- Soccer Ball 3D Sphere Base -->
    <circle cx="256" cy="256" r="92" fill="url(#ballBaseGrad)" />

    <!-- Hexagonal / Pentagonal Sapphire Inlays (Futuristic Pattern) -->
    <!-- Center Pentagon -->
    <polygon points="256,220 286,242 274,276 238,276 226,242" fill="url(#ballSapphireFacet)" stroke="#e2e8f0" stroke-width="3" stroke-linejoin="round" />
    <polygon points="256,225 281,244 271,272 241,272 231,244" fill="#60a5fa" opacity="0.35" />

    <!-- Top North Patch -->
    <polygon points="256,180 274,188 282,204 256,214 230,204 238,188" fill="url(#ballSapphireFacet)" stroke="#cbd5e1" stroke-width="2.5" stroke-linejoin="round" />

    <!-- North-East Patch -->
    <polygon points="308,206 332,226 322,248 296,240 290,220" fill="url(#ballSapphireFacet)" stroke="#cbd5e1" stroke-width="2.5" stroke-linejoin="round" />

    <!-- South-East Patch -->
    <polygon points="288,290 320,296 332,274 308,258 284,280" fill="url(#ballSapphireFacet)" stroke="#cbd5e1" stroke-width="2.5" stroke-linejoin="round" />

    <!-- South-West Patch -->
    <polygon points="224,290 228,280 204,258 180,274 192,296" fill="url(#ballSapphireFacet)" stroke="#cbd5e1" stroke-width="2.5" stroke-linejoin="round" />

    <!-- North-West Patch -->
    <polygon points="204,206 222,220 216,240 190,248 180,226" fill="url(#ballSapphireFacet)" stroke="#cbd5e1" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Seam Interconnecting Lines (Silver Gloss) -->
    <line x1="256" y1="214" x2="256" y2="220" stroke="#f1f5f9" stroke-width="2.5" />
    <line x1="286" y1="242" x2="308" y2="242" stroke="#f1f5f9" stroke-width="2.5" />
    <line x1="274" y1="276" x2="288" y2="290" stroke="#f1f5f9" stroke-width="2.5" />
    <line x1="238" y1="276" x2="224" y2="290" stroke="#f1f5f9" stroke-width="2.5" />
    <line x1="226" y1="242" x2="204" y2="242" stroke="#f1f5f9" stroke-width="2.5" />

    <!-- Specular Glossy 3D Highlight on Sphere -->
    <ellipse cx="228" cy="214" rx="46" ry="26" transform="rotate(-30 228 214)" fill="#ffffff" opacity="0.45" />
    <ellipse cx="218" cy="204" rx="16" ry="8" transform="rotate(-30 218 204)" fill="#ffffff" opacity="0.85" />

    <!-- Bottom Rim Light Bounce (Sapphire Reflection) -->
    <path d="M196 320 C230 344, 282 344, 316 320 C296 332, 216 332, 196 320 Z" fill="#38bdf8" opacity="0.75" />
  </g>

  <!-- Front Glass Specular Rim Corner Glint -->
  <circle cx="112" cy="112" r="6" fill="#ffffff" opacity="0.95" />
  <ellipse cx="112" cy="112" rx="14" ry="2" fill="#ffffff" opacity="0.8" />
  <ellipse cx="112" cy="112" rx="2" ry="14" fill="#ffffff" opacity="0.8" />
</svg>
