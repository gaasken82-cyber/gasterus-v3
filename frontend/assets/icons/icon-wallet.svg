<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Ambient Shadow for 3D Bounding Box -->
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020817" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.5" />
    </filter>

    <!-- Sapphire Edge Glow -->
    <filter id="sapphireGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Floating Object Shadow onto Glass Backplate -->
    <filter id="innerObjShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#020c22" flood-opacity="0.85" />
    </filter>

    <!-- Chrome / Silver Rim Metallic Filter -->
    <linearGradient id="silverBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#94a3b8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#f8fafc" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#64748b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.85" />
    </linearGradient>

    <!-- Sapphire Blue Glass Gradient -->
    <linearGradient id="sapphireFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#091e42" />
    </linearGradient>

    <!-- Glass Body Surface Fill -->
    <linearGradient id="glassBodyGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.7" />
    </linearGradient>

    <!-- Glass Top Sheen Specular Highlight -->
    <linearGradient id="specularHighlight" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Wallet / Card 3D Body Gradient -->
    <linearGradient id="cardBodyGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="40%" stop-color="#1d4ed8" />
      <stop offset="85%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Coin Gradient -->
    <radialGradient id="coinGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#60a5fa" />
      <stop offset="75%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f2b5c" />
    </radialGradient>
  </defs>

  <!-- ================= 3D GLASS BOUNDING BOX ================= -->
  <g id="boundingBox3D" filter="url(#boxShadow)">
    <rect x="68" y="76" width="376" height="376" rx="72" fill="#040d21" stroke="#0f2b5c" stroke-width="4" />
    <rect x="68" y="68" width="376" height="376" rx="72" fill="url(#glassBodyGrad)" stroke="url(#sapphireFrameGrad)" stroke-width="6" />
    <rect x="75" y="75" width="362" height="362" rx="66" fill="none" stroke="url(#silverBezel)" stroke-width="2" opacity="0.85" />
    <path d="M78 140 C78 95, 95 78, 140 78 L372 78 C310 140, 210 260, 78 310 Z" fill="url(#specularHighlight)" opacity="0.6" />
    <path d="M120 436 C200 442, 312 442, 392 436 C350 422, 162 422, 120 436 Z" fill="#38bdf8" opacity="0.4" filter="url(#sapphireGlow)" />
  </g>

  <!-- ================= 3D WALLET & FLOATING COIN ================= -->
  <g id="iconSubject" filter="url(#innerObjShadow)">
    <!-- 3D Card Extruded Base (Tilt -10deg) -->
    <g transform="rotate(-12 256 268)">
      <!-- Card Extrusion Depth -->
      <rect x="156" y="196" width="200" height="128" rx="20" fill="#040e24" stroke="#0f2b5c" stroke-width="3" />

      <!-- Main Glass-Card Surface -->
      <rect x="156" y="188" width="200" height="128" rx="20" fill="url(#cardBodyGrad)" stroke="url(#silverBezel)" stroke-width="2.5" />

      <!-- Card Hologram Chip (Silver Chrome) -->
      <rect x="180" y="224" width="38" height="30" rx="6" fill="url(#silverBezel)" stroke="#ffffff" stroke-width="1" />
      <line x1="180" y1="239" x2="218" y2="239" stroke="#475569" stroke-width="1.5" />
      <line x1="199" y1="224" x2="199" y2="254" stroke="#475569" stroke-width="1.5" />

      <!-- Card EMV Wireless Waves -->
      <path d="M232 230 A12 12 0 0 1 232 248" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
      <path d="M238 226 A18 18 0 0 1 238 252" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />

      <!-- Card Numbers Line -->
      <rect x="180" y="280" width="80" height="8" rx="4" fill="#60a5fa" opacity="0.6" />
      <rect x="272" y="280" width="38" height="8" rx="4" fill="#ffffff" opacity="0.5" />

      <!-- Diagonal Sheen on Card -->
      <path d="M156 210 L250 188 L210 316 L156 316 Z" fill="#ffffff" opacity="0.12" />
    </g>

    <!-- Floating 3D Sapphire Coin (Foreground, Right) -->
    <g transform="translate(306 280)">
      <!-- Coin Rim Depth -->
      <ellipse cx="0" cy="8" rx="42" ry="42" fill="#091b40" stroke="#1d4ed8" stroke-width="2" />
      <!-- Coin Front Face -->
      <ellipse cx="0" cy="0" rx="42" ry="42" fill="url(#coinGrad)" stroke="url(#silverBezel)" stroke-width="3" />
      <ellipse cx="0" cy="0" rx="34" ry="34" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.75" />
      <!-- Currency/Diamond Glyph in Coin -->
      <polygon points="0,-18 14,-4 0,18 -14,-4" fill="#ffffff" opacity="0.9" />
      <!-- Coin Specular Highlight -->
      <ellipse cx="-12" cy="-14" rx="14" ry="6" transform="rotate(-30 -12 -14)" fill="#ffffff" opacity="0.75" />
    </g>
  </g>

  <!-- Front Glass Specular Rim Corner Glint -->
  <circle cx="112" cy="112" r="6" fill="#ffffff" opacity="0.95" />
  <ellipse cx="112" cy="112" rx="14" ry="2" fill="#ffffff" opacity="0.8" />
  <ellipse cx="112" cy="112" rx="2" ry="14" fill="#ffffff" opacity="0.8" />
</svg>
