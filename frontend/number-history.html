<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Keluaran Angka Togel — GASTERUS V3</title>
  <meta name="description" content="Tabel data keluaran angka Togel pasaran resmi terlengkap Singapore, Hongkong, Sydney, Macau.">

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/mobile.css">
</head>
<body>

  <header class="app-header">
    <div class="container">
      <a href="/index.html" class="brand-logo">
        GASTERUS <span class="logo-badge">V3</span>
      </a>

      <div class="header-actions">
        <a href="/member.html" class="btn btn-secondary btn-sm">← Member Area</a>
      </div>
    </div>
  </header>

  <main class="app-main">
    <div class="container">
      <div style="margin-bottom: var(--space-6);">
        <h1 style="font-size: 1.75rem;">Data Pengeluaran Nomor Resmi</h1>
        <p style="font-size: 0.9rem;">Statistik dan arsip nomor keluar pasaran Togel dunia.</p>
      </div>

      <div class="card fade-in">
        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>Nama Pasaran</th>
                <th>Periode</th>
                <th>Tanggal Undian</th>
                <th>Angka Keluar (4D)</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="history-table-body">
              <tr>
                <td colspan="5" style="text-align: center; color: var(--text-muted); padding: var(--space-6);">
                  Memuat data histori angka...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <div class="container footer-bottom">
      &copy; 2026 GASTERUS V3. Platform Togel Resmi & Sportsbook.
    </div>
  </footer>

  <script type="module">
    import api from '/js/api.js';

    async function loadHistory() {
      const tbody = document.getElementById('history-table-body');
      try {
        const res = await api.get('/public/markets').catch(() => api.get('/member-api/markets'));
        const markets = res.items || res.data || res || [];

        tbody.innerHTML = markets.map(m => {
          const resNum = m.result ? `<span style="font-family:var(--font-mono); font-size:1.1rem; font-weight:800; color:var(--text-gold); letter-spacing:3px;">${m.result}</span>` : '<span style="color:var(--text-muted);">-</span>';
          return `
            <tr>
              <td><strong>${m.name}</strong></td>
              <td>#${m.period || '-'}</td>
              <td>${m.drawDate || new Date().toISOString().slice(0,10)}</td>
              <td>${resNum}</td>
              <td><span class="badge badge-success">Terverifikasi</span></td>
            </tr>
          `;
        }).join('');
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Gagal memuat histori keluaran.</td></tr>`;
      }
    }
    loadHistory();
  </script>
</body>
</html>
