services:
  - type: worker
    name: gasterus-sportsbook-render-worker
    runtime: docker
    repo: https://github.com/rajawali50121-cpu/gasterus-v3
    branch: master
    dockerfilePath: ./deploy/Dockerfile.sportsbook-render-worker
    dockerContext: .
    autoDeploy: false
    plan: starter
    region: oregon
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SPORTSBOOK_INGEST_URL
        value: https://web-production-dc041.up.railway.app/api/internal/sportsbook/ingest
      - key: SPORTSBOOK_INGEST_HMAC_SECRET
        sync: false
      - key: SPORTSBOOK_RENDER_MAX_EVENTS
        value: "500"
      - key: SPORTSBOOK_INGEST_MAX_PAYLOAD_BYTES
        value: "6291456"
      - key: SPORTSBOOK_INGEST_MAX_AGE_SECONDS
        value: "180"
      - key: THE_ODDS_API_ENABLED
        value: "true"
      - key: THE_ODDS_API_KEY
        sync: false
      - key: THE_ODDS_API_REGIONS
        value: eu
      - key: THE_ODDS_API_MARKETS
        value: h2h
      # Cadence wajib lebih cepat dari jendela harga prematch
      # (SPORTSBOOK_MAX_PREMATCH_PRICE_AGE_SECONDS = 900 detik) supaya semua
      # taruhan prematch tidak pernah ditolak sebagai SPORTS_PRICE_STALE.
      - key: THE_ODDS_API_REFRESH_SECONDS
        value: "720"
      # Anggaran kuota The Odds API = jumlah sport x (86400 / refresh)
      # x markets x regions kredit/hari. Nilai sekarang:
      #   5 sport x 120 siklus x 1 (h2h) x 1 (eu) = 600 kredit/hari
      #   -> muat di paket Professional (667 kredit/hari).
      # Fokus liga andalan; tambah sport hanya bila memakai paket Business
      # (6.667 kredit/hari, muat sampai ~55 sport pada cadence ini).
      - key: THE_ODDS_API_SPORT_KEYS
        value: soccer_epl,soccer_spain_la_liga,soccer_italy_serie_a,soccer_germany_bundesliga,soccer_uefa_champs_league
      - key: THE_ODDS_API_MAX_TOTAL_EVENTS
        value: "500"
      - key: THE_ODDS_API_EVENT_MARKETS_ENABLED
        value: "false"
      - key: THE_ODDS_API_EVENT_MAX_EVENTS_PER_SPORT
        value: "0"
      - key: THE_ODDS_API_EVENT_MAX_TOTAL_EVENTS
        value: "0"
